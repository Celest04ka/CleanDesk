name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CleanDesk.exe
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanDesk
          path: bin/CleanDesk.exe

      - name: Attach zip to the release
        if: github.event_name == 'release'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          $zip = "CleanDesk-$env:TAG.zip"
          Compress-Archive -Path bin\CleanDesk.exe -DestinationPath $zip
          gh release upload $env:TAG $zip --clobber
